<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Evaluate OpenDefocus in your browser. Load an image, adjust the lens, and render locally with WebAssembly and WebGPU.">
    <meta name="theme-color" content="#17191d">
    <title>OpenDefocus · Browser viewer</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17191d; color: #e5e8ee; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        canvas { width: 100%; height: 100%; position: fixed; inset: 0; touch-action: none; }
        #startup { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #17191d; }
        #startup[hidden] { display: none; }
        main { max-width: 520px; }
        .eyebrow { color: #9aacb8; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
        h1 { font-weight: 600; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.04em; margin: 12px 0; }
        p { line-height: 1.6; color: #b8c1cd; }
        #status { color: #e5e8ee; }
        button { padding: 10px 18px; border: 1px solid #526373; border-radius: 6px; background: #293541; color: inherit; cursor: pointer; }
        button:focus-visible { outline: 2px solid #c3e2ff; outline-offset: 3px; }
    </style>
</head>
<body>
    <canvas id="viewer" aria-label="OpenDefocus image and lens controls"></canvas>
    <div id="startup">
        <main>
            <div class="eyebrow">OpenDefocus / Browser viewer</div>
            <h1>A lens for your images.</h1>
            <p>Load a photo and explore defocus, bokeh, and depth. Images stay on your device.</p>
            <p id="status" role="status" aria-live="polite">Loading WebAssembly…</p>
            <button id="retry" hidden>Try again</button>
            <noscript><p>Enable JavaScript to use the WebAssembly viewer.</p></noscript>
        </main>
    </div>
    <script type="module">
        const startup = document.getElementById('startup');
        const status = document.getElementById('status');
        const retry = document.getElementById('retry');
        retry.addEventListener('click', () => location.reload());
        try {
            if (!isSecureContext || !navigator.gpu) {
                throw new Error('This viewer requires WebGPU. Open it in a WebGPU-enabled browser over HTTPS or localhost.');
            }
            const { default: init, start } = await import('./opendefocus.js');
            await init();
            await start(document.getElementById('viewer'));
            startup.hidden = true;
        } catch (error) {
            status.textContent = `Unable to start: ${error.message ?? error}`;
            retry.hidden = false;
        }
    </script>
</body>
</html>

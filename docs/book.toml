[book]
title = "OpenDefocus"
authors = ["olivebowl"]
language = "en"

[output.html]
preferred-dark-theme = "navy"
no-section-label = false
git-repository-url = "https://github.com/opendefocus/opendefocus"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/opendefocus/opendefocus/edit/main/docs/src/{path}"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[package]
name = "opendefocus"
description = "An advanced open-source convolution library for image post-processing"
version.workspace = true
readme.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
documentation.workspace = true
homepage.workspace = true
categories.workspace = true
publish = true

[lib]
name = "opendefocus"
path = "src/lib.rs"
crate-type = ["staticlib", "dylib", "rlib"]

[features]
serde = ["dep:serde", "bokeh-creator/serde", "circle-of-confusion/serde"]
default = ["wgpu"]
wgpu = ["dep:wgpu"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
ndarray = "0.17.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
thiserror = "2.0.21"
wgpu = { version = "30.0.1", default-features = false, features = [
    "metal",
    "vulkan",
    "wgsl",
    "vulkan-portability",
], optional = true }
circle-of-confusion = { path = "../circle-of-confusion", version = "0.2.7" }
bokeh-creator = { path = "../bokeh-creator", version = "0.1.17", default-features = false, features = [
    "renderer",
] }

bitflags = { version = "2.13.2", features = ["bytemuck"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
futures-channel = "0.3.34"


[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu"], optional = true }

[dev-dependencies]
assert_approx_eq = "1.1.0"
image-compare = "0.5.0"
rstest = { version = "0.28.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "exr", "hdr", "tiff"] }
tokio  = {version = "1.53.2", features = ["macros", "rt-multi-thread"]}
tokio-test = "0.4.6"
image-ndarray = { path = "../image-ndarray", version = "0.1.6" }
anyhow = "1.0.104"

[lints]
workspace = true

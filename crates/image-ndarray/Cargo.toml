[package]
name = "image-ndarray"
version = "0.1.7"
edition = "2024"
license = "EUPL-1.2"
authors = ["olivebowl <olivebowl@noreply.codeberg.org>"]
description = "Zero-copy implementations for the Image crate to convert to and from ndarrays"
repository = "https://github.com/opendefocus/opendefocus"
documentation = "https://docs.rs/image-ndarray"
keywords = ["image-processing", "array"]
categories = ["multimedia", "graphics", "data-structures"]

include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
default = ["image"]
std = ["thiserror/std"]
image = ["std", "dep:image", "ndarray/std"]

[lib]
name = "image_ndarray"

[dependencies]
image = { version = "0.25.10", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
ndarray = { version = "0.17.2", default-features = false }


[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }

[lints]
workspace = true

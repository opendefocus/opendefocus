[package]
name = "bokeh-creator"
version = "0.2.0"
edition = "2024"
license = "EUPL-1.2"
readme = "README.md"
include = ["src/**", "tests/**", "fixtures/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
authors = ["olivebowl <olivebowl@noreply.codeberg.org>"]
description = "Easy to use library to replicate real world lens kernels"
repository = "https://github.com/opendefocus/opendefocus"
documentation = "https://docs.rs/bokeh-creator"
keywords = ["bokeh", "camera", "photography", "lens", "convolution"]
categories = ["algorithms", "multimedia", "graphics"]

[features]
default = ["image", "noise"]
renderer = ["dep:ndarray", "std", "dep:glam"]
noise = ["dep:libnoise", "std"]
image = ["dep:image", "std", "dep:image-ndarray"]
std = ["ndarray/std", "glam/default", "renderer"]
serde = ["dep:serde"]
documented = ["dep:documented"]


[dependencies]
libnoise = { version = "1.1", default-features = false, optional = true }
glam = { version = "0.34", default-features = false, optional = true}
ndarray = { version = "0.17.2", default-features = false, optional = true}
image = { version = "0.25", optional = true, default-features = false }
image-ndarray = { path = "../image-ndarray", version = "0.1.7", features = ["image"], optional = true}
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true}
documented = {version = "0.10.0", optional = true}

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr", "tiff"] }
image-compare = "0.5.0"
image-ndarray = { path = "../image-ndarray", version = "0.1.7" }
rstest = { version = "0.28.0", default-features = false }

[lints]
workspace = true

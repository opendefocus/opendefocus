[package]
name = "opendefocus-ui"
description = "Standalone OpenDefocus evaluation viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "exr", "hdr"] }
image-ndarray = { path = "../image-ndarray", version = "0.1.6" }
ndarray = "0.17.2"
opendefocus = { path = "../opendefocus" }
rfd = "0.17.2"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[lints]
workspace = true

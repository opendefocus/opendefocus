[package]
name = "opendefocus-ofx"
description = "OpenFX plugin for OpenDefocus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "opendefocus_ofx"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.17.2"
opendefocus = { path = "../opendefocus" }
pollster = "1.0.1"

[dev-dependencies]
# The parity test serializes Settings::default() to compare JSON leaves; that needs `serde`.
opendefocus = { path = "../opendefocus", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "exr"] }
libloading = "0.9.0"
serde_json = "1.0.154"

[lints]
workspace = true

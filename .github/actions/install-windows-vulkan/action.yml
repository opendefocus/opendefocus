name: Install a software Vulkan driver (Windows)
description: >
  Installs the Vulkan loader and the Mesa lavapipe software Vulkan driver, because Windows
  runners have no GPU and so no Vulkan runtime, and points the loader at the driver. The latest
  mesa-dist-win release is used.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        dir="$RUNNER_TEMP/vulkan-runtime"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/runtime.zip" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip
        unzip -q "$dir/runtime.zip" -d "$dir"
        loader=$(find "$dir" -path '*/x64/vulkan-1.dll' -type f -print -quit)
        test -n "$loader"
        cygpath -w "$(dirname "$loader")" >> "$GITHUB_PATH"
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        dir="$RUNNER_TEMP/mesa"
        mkdir -p "$dir"
        gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --dir "$dir"
        7z x -y -o"$dir" "$dir"/*release-msvc.7z > /dev/null
        icd=$(find "$dir" -name lvp_icd.x86_64.json -type f -print -quit)
        test -n "$icd"
        echo "VK_DRIVER_FILES=$(cygpath -w "$icd")" >> "$GITHUB_ENV"
    - shell: bash
      run: vulkaninfo --summary

name: PR preview

# Renders the parity scenes with the pull request build and with the base branch build,
# publishes the images to the gh-pages branch and keeps one comment on the pull request
# with the images, timings and pixel differences (cargo xtask preview). The macOS runner gives
# the renders its virtual Metal adapter, which is far faster than a software Vulkan adapter on
# Linux; its timings are only meaningful as a change between base and head. The WebAssembly viewer of the pull request is built too and published
# next to the images, so it can be tried in the browser from GitHub Pages (served from the
# gh-pages branch). Pull requests from forks are skipped because they cannot publish.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'crates/opendefocus/**'
      - 'crates/opendefocus-cli/**'
      - 'crates/opendefocus-ui/**'
      - 'crates/image-ndarray/**'
      - 'crates/circle-of-confusion/**'
      - 'crates/bokeh-creator/**'
      - 'test/images/**'
      - 'test/parity/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pr-preview.yaml'

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:
  render:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            base -> target
          cache-on-failure: true
      - name: Build the head and base CLI
        run: |
          cargo build --release --locked -p opendefocus-cli
          cargo build --release --locked -p opendefocus-cli --manifest-path base/Cargo.toml
      - name: Render the scenes
        run: >
          cargo xtask preview
          --head target/release/opendefocus-cli
          --base base/target/release/opendefocus-cli
          --out preview
          --image-base-url "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}"
          --web-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/web/"
      - name: Show the comment in the job summary
        run: cat preview/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            preview/comment.md
            preview/head/*.png
            preview/base/*.png
            preview/diff/*.png
            preview/sweep/*.png

  web:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - run: cargo xtask --compile --web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            target/web/index.html
            target/web/opendefocus.js
            target/web/opendefocus_bg.wasm

  publish:
    needs: [render, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: preview
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - name: Publish the images and the viewer to the gh-pages branch
        run: |
          git init -q previews
          cd previews
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin gh-pages || true
          git checkout -q FETCH_HEAD 2>/dev/null || true
          rm -rf "pr-${PR}"
          mkdir -p "pr-${PR}/${SHA}"
          cp -R ../preview/head ../preview/base ../preview/diff ../preview/sweep "pr-${PR}/${SHA}/"
          cp -R ../web "pr-${PR}/web"
          touch .nojekyll
          git checkout -q --orphan snapshot
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Render previews"
          git push -q --force origin snapshot:gh-pages
      - name: Update the pull request comment
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file preview/comment.md --edit-last --create-if-none

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove the images of the closed pull request
        run: |
          git init -q previews
          cd previews
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin gh-pages || exit 0
          git checkout -q FETCH_HEAD
          rm -rf "pr-${PR}"
          git checkout -q --orphan snapshot
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q --allow-empty -m "Render previews"
          git push -q --force origin snapshot:gh-pages

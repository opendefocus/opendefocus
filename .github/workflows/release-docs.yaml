name: Documentation

# Builds the documentation book and the web viewer and publishes them to the root of the
# gh-pages branch, which GitHub Pages serves. The pr-* folders of the pull request previews
# on the same branch are kept.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/opendefocus-ui/**'
      - 'xtask/src/release.rs'
      - '.github/workflows/release-docs.yaml'

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'opendefocus/opendefocus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,mdbook@0.5.4,mdbook-toc@0.15.4,wasm-bindgen-cli@0.2.129
      - run: cargo xtask --release-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask --compile --web
      - run: cp -R target/web docs/book/demo
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/book
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: book
      - name: Publish the documentation to the gh-pages branch
        run: |
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin gh-pages || true
          git checkout -q FETCH_HEAD 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name 'pr-*' -exec rm -rf {} +
          cp -R ../book/. .
          touch .nojekyll
          git checkout -q --orphan snapshot
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Publish the documentation"
          git push -q --force origin snapshot:gh-pages

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'examples/**'
              - 'test/images/**'
              - 'test/parity/**'
              - 'packaging/**'
              - '.devcontainer/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.github/workflows/test.yaml'
            python:
              - 'test/natron/**'
              - 'ruff.toml'
              - '.github/workflows/test.yaml'
            docs:
              - 'docs/**'
              - 'about.toml'
              - 'licenses.hbs'
              - 'Cargo.lock'
              - 'xtask/src/release.rs'
              - 'README.md'
              - 'CHANGELOG.md'
              - '.github/workflows/test.yaml'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
      - run: cargo fmt --all -- --check
      - run: uvx --from ruff==0.14.4 ruff check test/natron
      - run: uvx --from ruff==0.14.4 ruff format --check test/natron
      - run: cargo xtask --precommit
      - run: cargo xtask --compile --gpu
      - run: cargo xtask --clippy

  test-linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux
          cache-on-failure: true
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo xtask --test-crates
      - run: cargo test --release --locked -p opendefocus-cli --no-default-features

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-windows
          cache-on-failure: true
      - run: cargo xtask --test-crates

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,mdbook@0.5.4,mdbook-toc@0.15.4
      - run: cargo xtask --release-docs

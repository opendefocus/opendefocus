name: Probe Metal

# Throwaway: reports which GPU adapter the macOS runners give the CLI.

on:
  pull_request:
    paths:
      - '.github/workflows/probe-metal.yaml'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p opendefocus-cli
      - name: Render on the runner GPU
        run: |
          for quality in fast accurate; do
            target/release/opendefocus-cli test/images/scenes/occlusion/color.exr \
              --depth test/images/scenes/occlusion/coc.exr \
              --settings test/parity/settings/direct_coc.json --radius 24 \
              --quality "$quality" --repeat 5 --report "report-$quality.json" \
              --output "out-$quality.exr" > /dev/null || echo "render failed: $quality"
            python3 - "$quality" <<'PY'
          import json, sys
          try:
              r = json.load(open(f"report-{sys.argv[1]}.json"))
              ms = sorted(f["frame_ms"] for f in r["frames"][2:])
              print(sys.argv[1], "device:", r["device"], "median ms:", ms[len(ms) // 2])
          except Exception as e:
              print(sys.argv[1], "no report:", e)
          PY
          done
          system_profiler SPDisplaysDataType | head -20 || true

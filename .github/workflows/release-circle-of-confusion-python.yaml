name: Circle of Confusion Python distributions

# Builds the Linux and Windows wheels and the source distribution and publishes them to PyPI
# for a circle-of-confusion release tag. The test-circle-of-confusion workflow covers pull
# requests and main, so this workflow only runs for releases. macOS wheels are not built
# until that platform is tested in CI.

on:
  push:
    tags:
      - 'circle-of-confusion-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: circle-of-confusion release tag to build, for example refs/tags/circle-of-confusion-v0.3.0
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Published circle-of-confusion tag selected by the coordinated Rust release
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/circle-of-confusion
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(inputs.ref || github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: circle-of-confusion-wheels-linux-${{ matrix.platform.target }}
          path: crates/circle-of-confusion/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/circle-of-confusion
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(inputs.ref || github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: circle-of-confusion-wheels-musllinux-${{ matrix.platform.target }}
          path: crates/circle-of-confusion/dist

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/circle-of-confusion
          target: x64
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(inputs.ref || github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: circle-of-confusion-wheels-windows-x64
          path: crates/circle-of-confusion/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/circle-of-confusion
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: circle-of-confusion-wheels-sdist
          path: crates/circle-of-confusion/dist

  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: circle-of-confusion-wheels-sdist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and test the standalone source distribution
        run: |
          python -m pip install dist/*.tar.gz pytest
          mkdir source
          tar -xzf dist/*.tar.gz -C source
          cd source/circle_of_confusion-*
          python -m pytest crates/circle-of-confusion/test/python

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'opendefocus/opendefocus' && (startsWith(inputs.ref || github.ref, 'refs/tags/circle-of-confusion-v') || github.event_name == 'workflow_dispatch')
    needs: [linux, musllinux, windows, sdist, test-sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify release tag matches crate and Python dynamic version
        if: startsWith(inputs.ref || github.ref, 'refs/tags/circle-of-confusion-v')
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('crates/circle-of-confusion/Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_REF'] == f'refs/tags/circle-of-confusion-v{version}'
          PYCODE
      - uses: actions/download-artifact@v8
        with:
          pattern: circle-of-confusion-wheels-*
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'circle-of-confusion-wheels-*/*'
      - name: Publish to PyPI
        if: startsWith(inputs.ref || github.ref, 'refs/tags/circle-of-confusion-v')
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing circle-of-confusion-wheels-*/*

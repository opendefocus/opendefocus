name: Test image-ndarray

on:
  push:
    branches: [main]
    paths:
      - 'crates/image-ndarray/**'
      - 'crates/bokeh-creator/**'
      - 'crates/opendefocus*/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-image-ndarray.yaml'
  pull_request:
    paths:
      - 'crates/image-ndarray/**'
      - 'crates/bokeh-creator/**'
      - 'crates/opendefocus*/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-image-ndarray.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Preserve both upstream debug test commands, including doc tests.
      - run: cargo test -p image-ndarray --no-default-features --locked
      - run: cargo test -p image-ndarray --features image --locked
      - run: cargo test -p image-ndarray --no-default-features --features std --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p image-ndarray --check
      - run: cargo clippy -p image-ndarray --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p image-ndarray --no-default-features --target thumbv7em-none-eabi --locked
      - run: cargo doc -p image-ndarray --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p image-ndarray --locked
      - name: Test standalone package with fresh dependency resolution
        run: |
          mkdir -p "$RUNNER_TEMP/image-ndarray-package"
          tar -xzf target/package/image-ndarray-*.crate -C "$RUNNER_TEMP/image-ndarray-package"
          cd "$RUNNER_TEMP/image-ndarray-package"/image-ndarray-*
          rm Cargo.lock
          cargo test --no-default-features
          cargo test --features image
      - run: cargo publish -p image-ndarray --locked --dry-run

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo test --release -p bokeh-creator -p opendefocus -p opendefocus-cli --locked
      - run: cargo check --release -p opendefocus-ui -p simple --locked

[package]
name = "xtask"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
duct = { version = "1.1.2", default-features = false }
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "stream"] }
url = "2.5.8"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
async-compression = { version = "0.4.50", default-features = false, features = [
    "tokio",
    "gzip",
] }
astral-tokio-tar = { version = "0.7.0", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2"] }
html-to-markdown-rs = { version = "3.17.2", default-features = false }
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
toml = { version = "1.1.7", default-features = false, features = ["std", "parse", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr"] }
exr = { version = "1.74", default-features = false }
libloading = "0.8"
png = "0.18"
sha2 = "0.11.0"
async-walkdir = "2.2.0"
find-msvc-tools = "0.1.14"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
tempfile = { version = "3", default-features = false }

[lints]
workspace = true

[build-dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"
